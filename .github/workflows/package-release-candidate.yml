name: Package Release Candidate

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    if: "${{ startsWith(github.event.head_commit.message, 'release: package v') }}"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $yaml = Get-Content '.\src\DLsiteUpdateMonitor.Plugin\extension.yaml' -Raw
          $match = [regex]::Match($yaml, '(?m)^Version:\s*(?<v>\d+(?:\.\d+){2})\s*$')
          if (-not $match.Success) { throw 'extension.yaml Version missing.' }
          $version = $match.Groups['v'].Value
          [xml]$project = Get-Content '.\src\DLsiteUpdateMonitor.Plugin\DLsiteUpdateMonitor.Plugin.csproj'
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($projectVersion -ne $version) { throw "Version mismatch: extension=$version csproj=$projectVersion" }
          if ('${{ github.event.head_commit.message }}' -ne "release: package v$version") { throw 'Package trigger message/version mismatch.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore Core tests
        run: dotnet restore .\tests\DLsiteUpdateMonitor.Core.Tests\DLsiteUpdateMonitor.Core.Tests.csproj

      - name: Run Core tests
        run: dotnet test .\tests\DLsiteUpdateMonitor.Core.Tests\DLsiteUpdateMonitor.Core.Tests.csproj -c Release --no-restore

      - name: Static validation
        run: python .\tools\Static-Validate.py

      - name: Restore Playnite plugin
        run: dotnet restore .\src\DLsiteUpdateMonitor.Plugin\DLsiteUpdateMonitor.Plugin.csproj

      - name: Build Playnite plugin
        run: dotnet build .\src\DLsiteUpdateMonitor.Plugin\DLsiteUpdateMonitor.Plugin.csproj -c Release --no-restore

      - name: Stage and validate exact package payload
        shell: pwsh
        run: |
          $out = '.\src\DLsiteUpdateMonitor.Plugin\bin\Release'
          $dest = '.\artifacts\plugin'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          @('DLsiteUpdateMonitor.dll', 'DLsiteUpdateMonitor.Core.dll', 'extension.yaml') | ForEach-Object {
            $source = Join-Path $out $_
            if (-not (Test-Path $source)) { throw "Required build output missing: $_" }
            Copy-Item $source $dest -Force
          }
          if (-not (Test-Path '.\LICENSE')) { throw 'Repository MIT LICENSE is missing.' }
          Copy-Item '.\LICENSE' (Join-Path $dest 'LICENSE') -Force
          Get-ChildItem $out -Filter '*.pdb' -ErrorAction SilentlyContinue | Copy-Item -Destination $dest -Force
          @('Playnite.SDK.dll', 'AngleSharp.dll', 'Newtonsoft.Json.dll') | ForEach-Object {
            if (Test-Path (Join-Path $dest $_)) { throw "Forbidden runtime DLL bundled: $_" }
          }

      - name: Download official Playnite 10.56 Toolbox
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'playnite-10.56.7z'
          $dest = Join-Path $env:RUNNER_TEMP 'playnite-10.56'
          Invoke-WebRequest -Uri 'https://github.com/JosefNemec/Playnite/releases/download/10.56/10.56.7z' -OutFile $archive
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
          if (-not (Test-Path $sevenZip)) { throw '7-Zip was not found on the Windows runner.' }
          & $sevenZip x $archive "-o$dest" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction failed: $LASTEXITCODE" }
          $toolbox = Get-ChildItem $dest -Recurse -File | Where-Object { $_.Name -in @('Toolbox.exe','Playnite.Toolbox.exe') } | Select-Object -First 1
          if (-not $toolbox) { throw 'Playnite Toolbox executable was not found in the official 10.56 package.' }
          "TOOLBOX_PATH=$($toolbox.FullName)" >> $env:GITHUB_ENV
          Write-Host "Toolbox: $($toolbox.FullName)"

      - name: Pack exact release candidate
        id: pack
        shell: pwsh
        run: |
          $release = '.\artifacts\release-candidate'
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          & $env:TOOLBOX_PATH pack '.\artifacts\plugin' $release
          if ($LASTEXITCODE -ne 0) { throw "Toolbox pack failed: $LASTEXITCODE" }
          $packages = @(Get-ChildItem $release -Filter '*.pext' -File)
          if ($packages.Count -ne 1) { throw "Expected one .pext, found $($packages.Count)." }
          $package = $packages[0]
          $hash = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($package.Name)" | Set-Content (Join-Path $release 'SHA256SUMS.txt') -Encoding ascii
          @(
            'DLsite Update Monitor release candidate',
            "Version: ${{ steps.version.outputs.version }}",
            "Source commit: $env:GITHUB_SHA",
            "Package: $($package.Name)",
            "SHA-256: $hash",
            'Playnite Toolbox source: official Playnite 10.56 release',
            'Core tests / Static validation / net462 build / payload boundary: PASS',
            'Runtime install gate: PENDING user confirmation'
          ) | Set-Content (Join-Path $release 'RELEASE-SUMMARY.txt') -Encoding utf8
          "package=$($package.Name)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "Package: $($package.Name)"
          Write-Host "SHA-256: $hash"

      - name: Upload exact release candidate
        uses: actions/upload-artifact@v4
        with:
          name: DLsiteUpdateMonitor-v${{ steps.version.outputs.version }}-release-candidate-${{ github.sha }}
          path: .\artifacts\release-candidate
          if-no-files-found: error
          retention-days: 14
