name: Core CI

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Core tests
        run: dotnet restore ./tests/DLsiteUpdateMonitor.Core.Tests/DLsiteUpdateMonitor.Core.Tests.csproj

      - name: Run Core tests
        run: dotnet test ./tests/DLsiteUpdateMonitor.Core.Tests/DLsiteUpdateMonitor.Core.Tests.csproj -c Release --no-restore

      - name: Static validation
        run: python ./tools/Static-Validate.py
