name: Core CI

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'docs/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify SDK
        run: dotnet --version

      - name: Restore Core tests
        run: dotnet restore ./tests/DLsiteUpdateMonitor.Core.Tests/DLsiteUpdateMonitor.Core.Tests.csproj

      - name: Run Core tests
        run: dotnet test ./tests/DLsiteUpdateMonitor.Core.Tests/DLsiteUpdateMonitor.Core.Tests.csproj -c Release --no-restore

      - name: Static validation
        run: python ./tools/Static-Validate.py

  plugin-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify SDK
        run: dotnet --version

      - name: Restore Playnite plugin
        run: dotnet restore .\src\DLsiteUpdateMonitor.Plugin\DLsiteUpdateMonitor.Plugin.csproj

      - name: Build Playnite plugin
        run: dotnet build .\src\DLsiteUpdateMonitor.Plugin\DLsiteUpdateMonitor.Plugin.csproj -c Release --no-restore

      - name: Validate plugin payload boundary
        shell: pwsh
        run: |
          $out = '.\src\DLsiteUpdateMonitor.Plugin\bin\Release'
          @('DLsiteUpdateMonitor.dll', 'DLsiteUpdateMonitor.Core.dll', 'extension.yaml') | ForEach-Object {
            if (-not (Test-Path (Join-Path $out $_))) { throw "Required build output missing: $_" }
          }
          @('Playnite.SDK.dll', 'AngleSharp.dll', 'Newtonsoft.Json.dll') | ForEach-Object {
            if (Test-Path (Join-Path $out $_)) { throw "Forbidden runtime DLL bundled: $_" }
          }

      - name: Stage smoke-test payload
        shell: pwsh
        run: |
          $out = '.\src\DLsiteUpdateMonitor.Plugin\bin\Release'
          $dest = '.\artifacts\smoke-plugin'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          @('DLsiteUpdateMonitor.dll', 'DLsiteUpdateMonitor.Core.dll', 'extension.yaml') | ForEach-Object {
            Copy-Item (Join-Path $out $_) $dest -Force
          }
          Get-ChildItem $out -Filter '*.pdb' -ErrorAction SilentlyContinue | Copy-Item -Destination $dest -Force

      - name: Upload smoke-test payload
        uses: actions/upload-artifact@v4
        with:
          name: DLsiteUpdateMonitor-smoke-${{ github.sha }}
          path: .\artifacts\smoke-plugin
          if-no-files-found: error
          retention-days: 14
