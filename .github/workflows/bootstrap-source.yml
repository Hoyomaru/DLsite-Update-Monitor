name: ソースツリー初期化

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 検証済みソースを復元
        shell: bash
        run: |
          set -euo pipefail
          cat _bootstrap/txz.part*.b64 > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/dlum_source.tar.xz
          echo "c01b61257a2a4b02ce811ac1c1cdbda9bd0879ec011f1f46593178b78a1fbbf5  /tmp/dlum_source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/dlum_source.tar.xz -C .
          rm -rf _bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          rm -f MILESTONE2_STATUS.md MILESTONE3_STATUS.md MILESTONE3_1_STATUS.md MILESTONE3_2_STATUS.md RELEASE_CANDIDATE_STATUS.md
          cat > .gitignore <<'EOF'
          bin/
          obj/
          artifacts/
          TestResults/
          .vs/
          *.user
          *.suo
          *.nupkg
          *.pext
          EOF

      - name: ソースをコミット
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hoyomaru"
          git config user.email "155284954+Hoyomaru@users.noreply.github.com"
          git add -A
          git commit -m "DLsite Update Monitor v0.1.0 ソースを追加"
          git push
